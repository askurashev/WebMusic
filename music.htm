<!DOCTYPE html>
<html id="doc">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="manifest" href="music.webmanifest" crossorigin="use-credentials">
	<link rel="stylesheet" href="music.css" type="text/css">
	<link rel="stylesheet" href="music.theme.css" type="text/css">
	<link rel="stylesheet" href="music.layout.css" type="text/css">
	<link rel="icon" href="music.png" type="image/png">
	<script src="music.js"></script>
	<script src="charts.js" defer></script>
	<title id="pagetitle">♫</title>
</head>
<body id="body" class="hide" onload="init()">
	<span id="splash"></span>
	<div id="player">
		<div id="player-main" class="toolbar">
		<img id="cover" src="music.png" onclick="zoom()" accesskey="z" oncontextmenu="toggle(event)" onload="this.style.opacity = ''">
		<div id="current">
			<div id="album" class="title dim" onclick="setFilter(event)"></div>
			<div id="title" class="title dim" onclick="setFilter(event)"></div>
			<div id="current-actions" aria-label="Действия с текущим треком">
				<button id="player-chart-toggle" type="button" title="Добавить текущий трек в чарт недели" aria-label="Добавить текущий трек в чарт недели" disabled>☆</button>
				<button id="player-archive-toggle" type="button" title="Архивировать текущий трек" aria-label="Архивировать текущий трек" disabled>▣</button>
				<button id="player-playlist-toggle" type="button" title="Добавить текущий трек в плейлист" aria-label="Плейлисты текущего трека" aria-expanded="false" disabled>＋ Плейлист</button>
				<button id="player-edit-tags" type="button" title="Редактировать теги трека" aria-label="Редактировать теги трека" disabled>✎</button>
				<button id="player-lyrics" type="button" title="Показать текст песни" aria-label="Показать текст песни" disabled>♫</button>
			</div>
			<div id="progress"><span id="time">00:00</span><input id="seek" type="range" min="0" max="1" value="0" step="any" onchange="seek('c')" oninput="seek('i')" onpointerdown="onSeek=true" onpointerup="onSeek=false" onpointercancel="onSeek=false" disabled></div>
			<div id="controls" class="toolbar">
				<button id="volume" onclick="toggle(event)" accesskey="u" oncontextmenu="mute(event)" contextkey="m"></button>
				<input id="volumeslider" type="range" min="0" step=".05" onchange="setVolume(event)" oninput="setVolume(event)">
				<button id="stop" onclick="stop()"></button>
				<button id="playpause" onclick="playPause()" accesskey=" "></button>
				<button id="previous" onclick="previous()" accesskey="[" oncontextmenu="skipArtist(event)" contextkey="K"></button>
				<button id="next" onclick="next()" accesskey="]" oncontextmenu="skipArtist(event)" contextkey="k"></button>


			</div>
		</div>
		<div aria-label="Очередь и настройки" id="player-actions"><button id="queue-toggle" class="drawer-toggle" onclick="togglePlayerDrawer('playlistdiv')" aria-label="Очередь воспроизведения" title="Очередь воспроизведения" aria-controls="playlistdiv" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M3 10h18M3 15h10M3 20h10" /></svg><span id="queue-count">0</span></button><button aria-label="Настройки" title="Настройки" id="tools-toggle" class="drawer-toggle" onclick="togglePlayerDrawer('player-tools')" aria-controls="player-tools" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h4m4 0h8M4 12h10m4 0h2M4 18h2m4 0h10M8 3v6m6 0v6M6 15v6" /></svg></button></div></div>
		<section id="player-tools" class="player-drawer" role="dialog" tabindex="-1" aria-label="Настройки плеера" hidden>

	<div id="options">
		<div class="wrapped toolbar" onclick="toggle(event)">
			<button id="enqueue" accesskey="e" oncontextmenu="getRandom(event)" contextkey="q"></button>
			<button id="crossfade" accesskey="o"></button>
			<button id="random" accesskey="r" oncontextmenu="shuffle(event)" contextkey="h"></button>

			<button id="share" accesskey="s"></button>
			<button id="lock" accesskey="l"></button>
			<button id="logbtn" accesskey="g"></button>
		</div>

		<div id="afterdiv">
				<button id="after" onclick="menu(event)" accesskey="a"></button>
				<div id="afteroptions" class="menu hide" onmouseleave="menu(event)" onclick="toggle(event)">
					<button id="stopplayback" accesskey="s"></button>
					<button id="repeatplaylist" accesskey="p"></button>
					<button id="playlibrary" accesskey="c"></button>
					<button id="randomlibrary" accesskey="r"></button>
					<button id="randomfiltered" accesskey="f"></button>
				</div>
			</div><div id="shares">
			<div id="sharefolder" class="folder sharediv toolbar">
				<input id="folderuri" class="uri" onclick="this.select()" readonly>
				<button id="folderdownload" class="download" onclick="download('folder')"></button>
				<button id="folderclip" class="link" onclick="clip('folder')"></button>
				<button id="foldershare" class="share" onclick="Popup.share('folder')"></button>
			</div>
			<div id="sharesong" class="song sharediv toolbar">
				<input id="songuri" class="uri" onclick="this.select()" readonly>
				<button id="songdownload" class="download" onclick="download('song')"></button>
				<button id="songclip" class="link" onclick="clip('song')"></button>
				<button id="songshare" class="share" onclick="Popup.share('song')"></button>
			</div>
			<div id="shareplaylist" class="playlist sharediv toolbar">
				<select id="playlisturi" class="uri"></select>
				<button id="playlistdownload" class="download" onclick="download('playlist')"></button>
				<button id="playlistclip" class="link" onclick="clip('playlist')"></button>
				<button id="playlistshare" class="share" onclick="Popup.share('playlist')"></button>
			</div>
			<a id="a" class="hide" href="#" rel="noreferrer" target="_blank" download=""></a>
		</div>
	</div>
		</section>
	<div id="playlistdiv" class="player-drawer" role="dialog" tabindex="-1" aria-label="Очередь воспроизведения" hidden onmouseup="resizePlaylist()">
		<div class="drawer-heading queue-toolbar"><button id="queue-clear" onclick="clearPlaylist()" title="Очистить всю очередь" aria-label="Очистить всю очередь"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button><button class="drawer-close" onclick="togglePlayerDrawer('playlistdiv', false)" aria-label="Закрыть очередь">×</button></div>
		<div>
			<div id="trash" class="hidden toolbar" onclick="toggle(event)" ondragover="allowDrop(event)" ondrop="removeItem(event); cls(this, 'drop', REM)" ondragenter="cls(this, 'drop', ADD)" ondragleave="cls(this, 'drop', REM)">
				<button id="playlistclear" class="clear" accesskey="c"></button>
				<button id="removesongs"></button>
			</div>
			<ul id="playlist" onclick="clickItem(event)" oncontextmenu="findItem(event)" ondragstart="prepDrag(event)" ondragover="allowDrop(event)" ondragend="endDrag()" ondrop="dropItem(event)" ondragenter="cls(event.target, 'over', ADD)" ondragleave="cls(event.target, 'over', REM)" onmouseenter="onplaylist=true" onmouseleave="onplaylist=false"></ul>
		</div>
	</div>
		<button id="toast" class="hide"></button>
	</div>
	<div id="library" hidden aria-hidden="true">
		<div class="toolbar">
			<input id="filter" onchange="filter()" onclick="setFocus(this)" accesskey="f" onfocus="this.select()">
			<button id="filterbtn" class="filter" onclick="filter()"></button>
			<button id="filterclear" class="clear" onclick="clearFilter()"></button>
			<div class="spacer"></div>
			<div class="hidden toolbar">
				<button id="reload" onclick="reloadLibrary()" accesskey="F5"></button>
				<button id="unfold" onclick="toggle(event)" accesskey="t"></button>
			</div>
		</div>
		<ul id="tree" onclick="treeClick(event)" oncontextmenu="treeClick(event, true)"></ul>
	</div>
	<section id="my-chart" aria-label="My Chart"></section>
	<template id="my-chart-template">
		<link rel="stylesheet" href="charts.css">

  <header><h1>Музыкальный чарт</h1></header>
  <main>
    <p id="status" role="status" aria-live="polite">Загружаем библиотеку…</p>
    <section class="weekbar" aria-label="Выбор недели">
      <input title="Выбрать неделю" aria-label="Выбрать неделю" type="date" id="week">
      <select title="Сохранённые чарты" aria-label="Сохранённые чарты" id="archive"><option value="">Выберите неделю</option></select>
      <button id="next-week">Следующая неделя →</button>
    </section>
    <div class="workspace">
      <section class="panel library"><div class="panelhead"><div class="panel-title"><h2>Библиотека</h2><span id="library-count" class="muted"></span></div><div class="library-icon-actions"><button id="reload-library" class="icon-button" title="Обновить библиотеку" aria-label="Обновить библиотеку"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1" /></svg></button><button id="enqueue-filtered" class="icon-button" title="Добавить весь показанный список в очередь" aria-label="Добавить весь показанный список в очередь"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M3 10h12M3 15h7m8-2v8m-4-4h8" /></svg></button></div></div>
        <div class="library-filters"><input type="search" id="search" placeholder="Поиск по библиотеке" aria-label="Поиск по библиотеке"><button type="button" id="playlist-filter" aria-label="Фильтр по плейлистам" aria-expanded="false">Вся библиотека ▾</button></div>
        <div class="library-filters"><select id="library-sort" aria-label="Сортировка библиотеки"><option value="name">Сортировка: по имени</option><option value="year">Сортировка: по году</option><option value="plays">Сортировка: по прослушиваниям</option></select></div>
        <div class="library-filters">
          <select id="chart-filter" aria-label="Фильтр по чарту выбранной недели"><option value="">Чарт недели: все треки</option><option value="in">Добавлены в чарт</option><option value="out">Не добавлены в чарт</option></select>
          <select id="archive-filter" aria-label="Фильтр по архиву треков"><option value="">Архив: все треки</option><option value="in">Только архивные</option><option value="out">Только не в архиве</option></select>
        </div>
        <span id="playlist-note" class="muted"></span>

        <div id="library" class="tracklist"></div><button id="more" hidden>Показать ещё</button>
      </section>
      <section class="panel chart"><div class="panelhead"><div class="panel-title"><h2>Чарт недели</h2><span id="chart-count" class="muted"></span></div><div class="chart-heading-actions"><button id="enqueue-chart" class="icon-button" title="Добавить весь чарт в очередь" aria-label="Добавить весь чарт в очередь"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M3 10h12M3 15h7m8-2v8m-4-4h8" /></svg></button><button id="save" class="icon-button" title="Сохранить плейлист" aria-label="Сохранить плейлист"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2M7 3v6h10V3M7 21v-8h10v8" /></svg></button><label class="auto-save" title="Автоматически сохранять изменения плейлиста"><input type="checkbox" id="auto-save">Авто</label><button aria-label="Копировать файлы в Current" title="Копировать файлы в Current" class="primary icon-button" id="export"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></svg></button></div></div>

        <p id="week-note" class="hint"></p>
        <ol id="ranking" aria-label="Рейтинг недели"></ol><button id="more-ranking" hidden>Показать ещё</button>
        <div id="export-result"></div>
      </section>
    </div>
    <section class="panel stats"><div class="panelhead"><div><h2>Итоги</h2></div><div class="period"><select title="Период итогов" aria-label="Период итогов" id="period-kind"><option value="month">Месяц</option><option value="year">Год</option></select><input title="Месяц" aria-label="Месяц" id="period" type="month"></div></div>
      <details class="stats-help"><summary>Как считается</summary><p id="stats-rule" class="hint"></p><p class="hint">Учитываются сохранённые недели по дате их понедельника.</p></details><div class="tablewrap"><table><thead><tr><th>Место</th><th>Композиция</th><th>Баллы</th><th>Недель в чарте</th><th>Лучшее место</th><th>Среднее место</th></tr></thead><tbody id="stats"></tbody></table></div>
    </section>
  </main>
  <dialog id="tag-editor" aria-labelledby="tag-heading">
    <form id="tag-form">
      <h2 id="tag-heading">Теги MP3</h2>
      <p id="tag-path" class="hint"></p>
      <label>Исполнитель<input id="tag-artist" autocomplete="off" maxlength="1000"></label>
      <label>Исполнитель альбома<input id="tag-albumArtist" autocomplete="off" maxlength="1000"></label>
      <label>Название песни<input id="tag-title" autocomplete="off" maxlength="1000"></label>
      <p class="hint">Изменения сохраняются в самом MP3. Перед записью создаётся резервная копия. Имя файла сохраняется.</p>
      <p id="tag-error" role="alert"></p>
      <div class="tag-buttons"><button type="button" id="tag-cancel">Отмена</button><button type="submit" id="tag-save" class="primary">Сохранить</button></div>
    </form>
  </dialog>
  <dialog id="lyrics-window" aria-labelledby="lyrics-heading">
    <header><h2 id="lyrics-heading">Текст песни</h2><button id="lyrics-close" type="button" aria-label="Закрыть">×</button></header>
    <pre id="lyrics-text"></pre>
  </dialog>
	</template>
	<div id="dim"></div>
	<div id="logdiv" class="hide">
		<div class="column">
			<div class="right toolbar">
				<button id="logdownload" class="download" onclick="saveLog()"></button>
				<button id="logclip" class="clip" onclick="dom.log.select(); document.execCommand('copy')"></button>
				<button id="logclear" class="clear" onclick="dom.log.value = ''"></button>
				&#160;&#160;
				<button id="theme" onclick="changeTheme(event)" accesskey="T" oncontextmenu="changeTheme(event)"></button>
				<button id="color" onclick="changeTheme(event)" accesskey="C" oncontextmenu="changeTheme(event)"></button>
				<button id="debug" onclick="toggle(event)"></button>
				&#160;&#160;
				<button id="logmin" class="min" onclick="dom.logbtn.click()"></button>
			</div>
			<textarea id="log" spellcheck="false"></textarea>
		</div>
	</div>
	<div id="popupdiv" class="hide" onclick="Popup.close()">
		<div id="popup" onclick="event.stopPropagation()">
			<div id="popupicon"></div>
			<div id="popupcontent"></div>
			<button id="ok" onclick="Popup.close(event)"></button>
			<button id="cancel" onclick="Popup.close()"></button>
		</div>
	</div>
	<footer id="copyleft">
		<a id="source" rel="noreferrer" target="_blank"></a>
	</footer>
<div aria-hidden="true" hidden id="legacy-playlist-controls"><button id="playlistbtn"></button><div id="playlistoptions" class="wrapped toolbar">
			<div id="playlistsdiv">
				<button id="playlistload" onclick="menu(event)"></button>
				<div id="playlists" class="menu hide" onclick="loadPlaylistBtn(event)" oncontextmenu="removePlaylist(event)" onmouseleave="menu(event)">
				</div>
			</div>
				<button id="playlistsave" onclick="prepPlaylists('save')"></button>
				<button id="playlistimport" onclick="importPlaylist()"></button>
				<button id="playlistexport" onclick="exportPlaylist()"></button>

		</div></div></body>
</html>
